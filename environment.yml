name: pedibus
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.26
  - openpyxl>=3.1          # reads the survey .xlsx
  - requests>=2.31         # geocoding API calls
  - scikit-learn>=1.4      # DBSCAN
  - typer>=0.12            # command-line interface
  - rich>=13.0             # coloured tables in the terminal
